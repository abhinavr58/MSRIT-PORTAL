name: Build iOS App (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS archive & IPA
        working-directory: ios
        run: |
          xcodebuild -workspace MSRITAttendance.xcworkspace \
            -scheme MSRITAttendance \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MSRITAttendance.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
          mkdir -p build/Payload
          cp -R build/MSRITAttendance.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r MSRIT-Attendance-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSRIT-Attendance-iOS-IPA
          path: ios/build/MSRIT-Attendance-iOS-Unsigned.ipa
